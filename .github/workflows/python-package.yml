name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8
          python -m pip check
      - name: Check syntax and undefined names
        run: python -m flake8 main.py gerar_zip.py tests --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test calculations, validation and distributed ZIP
        run: python -m unittest discover -s tests -v
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Open window and render graph on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python main.py --smoke-test
      - name: Start Windows launcher with a fresh environment and reuse it
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call iniciar_calculadora.bat --smoke-test <NUL
          if errorlevel 1 exit /b 1
          call iniciar_calculadora.bat --smoke-test <NUL
          if errorlevel 1 exit /b 1
